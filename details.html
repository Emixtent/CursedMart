<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Details | CursedMart</title>
    <style>
        body { background-color: #050505; color: #33ff33; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background-color: #0a0a0a; border: 1px solid #33ff33; padding: 40px; box-shadow: 0 0 20px #33ff33; text-align: center; }
        h1 { font-size: 2.5rem; margin-top: 0; text-transform: uppercase; }
        img { width: 100%; max-height: 400px; object-fit: contain; border-bottom: 1px dashed #33ff33; margin-bottom: 30px; filter: grayscale(100%) contrast(120%); }
        .lore-box { text-align: left; background: #000; border-left: 3px solid #ff003c; padding: 20px; color: #aaa; line-height: 1.8; margin-bottom: 30px; font-size: 1.1rem; }
        .price { font-size: 1.5rem; font-weight: bold; margin-bottom: 30px; }
        
        .buy-btn { background-color: transparent; color: #ff003c; border: 1px solid #ff003c; padding: 15px 30px; font-family: inherit; font-size: 1.2rem; text-transform: uppercase; cursor: pointer; width: 100%; margin-bottom: 15px; transition: 0.2s; font-weight: bold; }
        .buy-btn:hover { background-color: #ff003c; color: #000; }
        .back-btn { background-color: transparent; color: #888; border: 1px solid #888; padding: 10px 30px; font-family: inherit; font-size: 1rem; text-transform: uppercase; cursor: pointer; width: 100%; transition: 0.2s; }
        .back-btn:hover { color: #fff; border-color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="page-title">Loading...</h1>
        <img id="page-img" src="" alt="Cursed Item">
        
        <div style="text-align: left; margin-bottom: 10px; color: #ff003c; font-weight: bold;">CONTAINMENT FILE / CURSE MANIFEST:</div>
        <div class="lore-box" id="page-desc">Loading containment data...</div>
        
        <div class="price">PRICE: <span id="page-price">0.000 BTC</span></div>

        <button class="buy-btn" onclick="proceedToCheckout()">PROCEED TO SECURE CHECKOUT</button>
        <button class="back-btn" onclick="window.location.href='index.html'">RETURN TO CATALOG</button>
    </div>

    <script>
        // Retrieve the saved item data
        let itemData = JSON.parse(localStorage.getItem('cursedItem'));
        
        // If someone opens this page directly without clicking an item, send them back
        if (!itemData) {
            window.location.href = 'index.html';
        } else {
            // Inject the data into the page
            document.getElementById('page-title').innerText = itemData.title;
            document.getElementById('page-img').src = itemData.img;
            document.getElementById('page-desc').innerText = itemData.desc;
            document.getElementById('page-price').innerText = itemData.price + ' BTC';
        }

        function proceedToCheckout() {
            window.location.href = 'checkout.html';
        }
    </script>
</body>
</html>
