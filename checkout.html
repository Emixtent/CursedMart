<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout | CursedMart</title>
    <style>
        body { background-color: #050505; color: #ff003c; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 50px; display: flex; justify-content: center; }
        .checkout-container { background-color: #0a0a0a; border: 1px solid #ff003c; padding: 40px; width: 100%; max-width: 500px; text-align: center; box-shadow: 0 0 20px #ff003c; }
        h1 { margin-top: 0; text-transform: uppercase; font-size: 2rem; }
        .order-summary { background: #000; padding: 20px; margin: 20px 0; border: 1px dashed #555; text-align: left; }
        .btc-address { background: #000; padding: 15px; word-break: break-all; border: 1px dashed #ff003c; margin: 20px 0; font-size: 1rem; user-select: all; color: #33ff33; }
        .status { color: #ffaa00; font-size: 0.9rem; animation: blink 1.5s infinite; margin-bottom: 30px; }
        
        .cancel-btn { background: transparent; color: #888; border: 1px solid #888; padding: 12px 20px; cursor: pointer; font-family: inherit; text-transform: uppercase; width: 100%; transition: 0.2s; font-size: 1rem; }
        .cancel-btn:hover { color: #ff003c; border-color: #ff003c; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h1>Initiating Transfer</h1>
        
        <div class="order-summary">
            <p style="color: #aaa; margin: 0 0 10px 0;">PURCHASING:</p>
            <h2 id="checkout-title" style="margin: 0 0 10px 0; color: #fff;">...</h2>
            <p style="color: #aaa; margin: 0 0 5px 0;">AMOUNT DUE:</p>
            <h3 id="checkout-price" style="margin: 0; color: #33ff33;">...</h3>
        </div>

        <p style="color: #aaa; font-size: 0.9rem;">Send exact funds to the anonymous wallet below:</p>
        
        <div class="btc-address">
            bc1qxy2kgdygjrsqtzq2n0yrf2493p83kkfjhx0wlh
        </div>

        <p class="status">Awaiting blockchain confirmations [0/3]...</p>
        <button class="cancel-btn" onclick="window.location.href='index.html'">ABORT TRANSACTION</button>
    </div>

    <script>
        let itemData = JSON.parse(localStorage.getItem('cursedItem'));
        
        if (!itemData) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('checkout-title').innerText = itemData.title;
            document.getElementById('checkout-price').innerText = itemData.price + ' BTC';
        }
    </script>
</body>
</html>
